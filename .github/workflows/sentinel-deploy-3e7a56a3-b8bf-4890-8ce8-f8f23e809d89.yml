name: Deploy Content to sentws-b [3e7a56a3-b8bf-4890-8ce8-f8f23e809d89]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-3e7a56a3-b8bf-4890-8ce8-f8f23e809d89.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-3e7a56a3-b8bf-4890-8ce8-f8f23e809d89.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: '6a814bfc43ec5fd721d5575d-sentrepo-b'
      workspaceName: 'sentws-b'
      workspaceId: 'c36ae390-2482-48c1-80f9-e580883719b8'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule'
      branch: 'main'
      sourceControlId: '3e7a56a3-b8bf-4890-8ce8-f8f23e809d89'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_3e7a56a3b8bf48908ce8f8f23e809d89 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-3e7a56a3-b8bf-4890-8ce8-f8f23e809d89.ps1